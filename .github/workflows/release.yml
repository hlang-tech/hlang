name: Release

# Every push to main is a release. This workflow publishes the versions on main
# that the registry does not have yet, under @hlang-org and the @hlang-tech
# mirror, and creates their tags and GitHub Releases. When nothing is pending
# it stops after one check.
#
# npm authenticates with GitHub's OIDC token: each package trusts this workflow
# file on npmjs.com (trusted publishing), so no npm token or one-time password
# is stored anywhere, and every version carries a provenance attestation.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tags and GitHub Releases
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    name: Publish pending versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use a current npm
        run: npm install --global npm@^11.15.0

      - name: Check for unpublished versions
        id: check
        run: node scripts/release/publish.mjs --pending >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.check.outputs.pending == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and validate the packages
        if: steps.check.outputs.pending == 'true'
        run: pnpm exec turbo run build lint:pkg --filter='./packages/*'

      - name: Publish @hlang-org, tag, and release
        if: steps.check.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release/publish.mjs

      - name: Publish the @hlang-tech mirror
        if: steps.check.outputs.pending == 'true'
        run: node scripts/release/mirror-scope.mjs
