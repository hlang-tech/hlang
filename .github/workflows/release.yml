name: Release

# Every push to main is a release. This workflow publishes the versions on main
# that the registry does not have yet, under @hlang-org and the @hlang-tech
# mirror, and creates their tags and GitHub Releases, each carrying its tarball
# and provenance. When nothing is pending it only completes those releases.
#
# npm authenticates with GitHub's OIDC token: each package trusts this workflow
# file on npmjs.com (trusted publishing), so no npm token or one-time password
# is stored anywhere, and every version carries a provenance attestation.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish pending versions
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub Releases
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 24 bundles it since
      # 24.5.0. Stop with a clear message if the toolchain ever falls behind.
      - name: Check that npm supports trusted publishing
        run: >-
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number);
          if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
          console.error('npm ' + process.argv[1] + ' cannot publish with trusted publishing; it needs 11.5.1 or later.');
          process.exit(1); }" "$(npm --version)"

      - name: Check for unpublished versions
        id: check
        run: node scripts/release/publish.mjs --pending >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.check.outputs.pending == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and validate the packages
        if: steps.check.outputs.pending == 'true'
        run: pnpm exec turbo run build lint:pkg --filter='./packages/*'

      - name: Publish @hlang-org, tag, and release
        if: steps.check.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release/publish.mjs

      - name: Publish the @hlang-tech mirror
        if: steps.check.outputs.pending == 'true'
        run: node scripts/release/mirror-scope.mjs

      # Every GitHub Release carries the tarball it released and the provenance
      # npm recorded for it. This runs on every push to main, so it also
      # completes releases a previous run did not.
      - name: Attach the tarballs and their provenance to the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/attach-assets.mjs
